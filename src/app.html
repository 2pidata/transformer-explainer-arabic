<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Favicon -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="شارح المحوّل - أداة تفاعلية لتعلم كيفية عمل نماذج المحوّل (Transformer) مع دعم كامل للغة العربية" />
    <meta name="keywords" content="transformer, GPT, arabic, visualization, machine learning, NLP, تعلم الآلة, الذكاء الاصطناعي" />
    <meta name="author" content="Transformer Explainer Arabic" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="شارح المحوّل - Transformer Explainer" />
    <meta property="og:description" content="أداة تفاعلية لتعلم كيفية عمل نماذج المحوّل" />
    <meta property="og:image" content="%sveltekit.assets%/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="شارح المحوّل - Transformer Explainer" />
    <meta name="twitter:description" content="أداة تفاعلية لتعلم كيفية عمل نماذج المحوّل" />
    
    <!-- Fonts - Google Fonts pour l'arabe -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="%sveltekit.assets%/models/aragpt2-base/tokenizer.json" as="fetch" crossorigin />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#1e40af" />
    
    %sveltekit.head%
  </head>
  
  <body data-sveltekit-preload-data="hover" class="font-arabic">
    <div style="display: contents">%sveltekit.body%</div>
    
    <!-- Script pour détecter le thème système -->
    <script>
      // Détecter le thème préféré
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </body>
</html>
